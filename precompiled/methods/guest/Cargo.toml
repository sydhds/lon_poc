[package]
name = "no_spel-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "no_spel"
path = "src/bin/no_spel.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", branch = "main" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
no_spel_program = { path = "../../no_spel_program" }

# ── the only change from the original repo ──────────────────────────────
# The guest declares its own [workspace], so the patch in the outer workspace
# root never reached it. Repeating it here is what turns on the RISC Zero
# accelerator circuits. crypto-bigint is required: the k256 fork's bigint2
# path does not compile without it.
[patch.crates-io]
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
