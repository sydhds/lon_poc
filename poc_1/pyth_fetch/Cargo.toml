[package]
name = "pyth_fetch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
reqwest = { version = "0.13.2", features = ["json", "query"] }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
hex = "0.4.3"
pythnet-sdk = "2.3.1"
sha3 = "0.11.0"
k256 = { version = "0.13.4", features = ["ecdsa", "serde"] }
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive"] }
chrono = "0.4.44"
