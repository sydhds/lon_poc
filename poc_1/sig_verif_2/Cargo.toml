[workspace]
members = [
    "sig_verif_2_core",
    "methods",
    "examples",
]
exclude = [
    "methods/guest",
]
resolver = "2"

[workspace.dependencies]
# sha3 = "0.10.8"
k256 = { version = "0.13.4", features = ["ecdsa", "serde"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[patch.crates-io]
# Last version supported by risczero: https://github.com/risc0/RustCrypto-hashes/commit/62d84e1da613ab4f5a3259326e81ef25c6c012e1
# sha3 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }