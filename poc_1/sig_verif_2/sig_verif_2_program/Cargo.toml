[package]
name = "sig_verif_2_program"
version = "0.1.0"
edition = "2024"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", branch = "main" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
sig_verif_2_core = { path = "../sig_verif_2_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"